set -g @duh_config "/Users/kirill/.config/tmux/tmux.conf"
set -g @duh_theme "/Users/kirill/.local/state/duh/theme"
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -s escape-time 0
set -s copy-command pbcopy
set -g focus-events on
set -g history-limit 50000
set -g status-interval 5
set -g mouse on
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1
bind -r C-h select-window -t :-1
bind -r C-l select-window -t :+1

bind C-c new-session
bind x kill-pane
bind X kill-window
bind C-x kill-session
bind r source-file -F "#{@duh_config}" \; display "Config reloaded"

bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi / command-prompt -i -p "search down" "send-keys -X search-forward-incremental '%%%'"
bind -T copy-mode-vi ? command-prompt -i -p "search up" "send-keys -X search-backward-incremental '%%%'"
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt
bind p paste-buffer

bind -T root F12 set prefix None \; set key-table off \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; refresh-client -S

set -g @duh_prefix_fg black
set -g @duh_prefix_bg yellow
set -g @duh_copy_fg black
set -g @duh_copy_bg blue
set -g @duh_alert_fg black
set -g @duh_alert_bg red

set -g status-position top
set -g status-left-length 40
set -g status-left "[#S] "
setw -g window-status-format " #I:#W #{?window_zoomed_flag,Z ,}"
setw -g window-status-current-format " #I:#W #{?window_zoomed_flag,Z ,}"
set -g status-right-length 150
set -g status-right "#{?#{==:#{client_key_table},off},#[fg=#{@duh_alert_fg}]#[bg=#{@duh_alert_bg}]#[bold] LOCKED ,#{?client_prefix,#[fg=#{@duh_prefix_fg}]#[bg=#{@duh_prefix_bg}] ^A ,#{?pane_in_mode,#[fg=#{@duh_copy_fg}]#[bg=#{@duh_copy_bg}] Copy ,}}}#[default]#(gitmux -timeout 500ms -cfg '#{@duh_theme}/gitmux.conf' '#{pane_current_path}')"

source-file -qF "#{@duh_theme}/tmux.conf"
