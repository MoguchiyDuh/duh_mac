background = {{ colors.surface.default.hex }}
foreground = {{ colors.on_surface.default.hex }}
cursor-color = {{ colors.primary.default.hex }}
cursor-text = {{ colors.on_primary.default.hex }}
selection-background = {{ colors.primary_container.default.hex }}
selection-foreground = {{ colors.on_primary_container.default.hex }}
split-divider-color = {{ colors.outline_variant.default.hex }}
search-background = {{ colors.tertiary_container.default.hex }}
search-foreground = {{ colors.on_tertiary_container.default.hex }}
search-selected-background = {{ colors.tertiary.default.hex }}
search-selected-foreground = {{ colors.on_tertiary.default.hex }}

<* if {{ is_dark_mode }} *>
palette = 0={{ colors.surface_container_high.default.hex }}
palette = 1={{ colors.tertiary.default.hex }}
palette = 2={{ colors.secondary.default.hex }}
palette = 3={{ colors.tertiary_fixed.default.hex }}
palette = 4={{ colors.primary.default.hex }}
palette = 5={{ colors.primary_fixed.default.hex }}
palette = 6={{ colors.secondary_fixed.default.hex }}
palette = 7={{ colors.on_surface_variant.default.hex }}
palette = 8={{ colors.outline.default.hex }}
palette = 9={{ colors.tertiary.default.hex | lighten: 6.0 }}
palette = 10={{ colors.secondary.default.hex | lighten: 6.0 }}
palette = 11={{ colors.tertiary_fixed.default.hex | lighten: 6.0 }}
palette = 12={{ colors.primary.default.hex | lighten: 6.0 }}
palette = 13={{ colors.primary_fixed.default.hex | lighten: 6.0 }}
palette = 14={{ colors.secondary_fixed.default.hex | lighten: 6.0 }}
palette = 15={{ colors.on_surface.default.hex }}
<* else *>
palette = 0={{ colors.surface_container_high.default.hex }}
palette = 1={{ colors.tertiary.default.hex }}
palette = 2={{ colors.secondary.default.hex }}
palette = 3={{ colors.on_tertiary_fixed_variant.default.hex }}
palette = 4={{ colors.primary.default.hex }}
palette = 5={{ colors.on_primary_fixed_variant.default.hex }}
palette = 6={{ colors.on_secondary_fixed_variant.default.hex }}
palette = 7={{ colors.on_surface_variant.default.hex }}
palette = 8={{ colors.outline.default.hex }}
palette = 9={{ colors.tertiary.default.hex | lighten: -6.0 }}
palette = 10={{ colors.secondary.default.hex | lighten: -6.0 }}
palette = 11={{ colors.on_tertiary_fixed_variant.default.hex | lighten: -6.0 }}
palette = 12={{ colors.primary.default.hex | lighten: -6.0 }}
palette = 13={{ colors.on_primary_fixed_variant.default.hex | lighten: -6.0 }}
palette = 14={{ colors.on_secondary_fixed_variant.default.hex | lighten: -6.0 }}
palette = 15={{ colors.on_surface.default.hex }}
<* endif *>