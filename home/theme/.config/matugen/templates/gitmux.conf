tmux:
    symbols:
        branch: "⎇ "
        hashprefix: ":"
        ahead: ↑·
        behind: ↓·
        staged: "● "
        conflict: "✖ "
        modified: "✚ "
        untracked: "… "
        stashed: "⚑ "
        insertions: Σ
        deletions: Δ
        clean: ✔

    styles:
        clear: "#[none]"
        state: "#[fg={{ colors.tertiary.default.hex }},bold]"
        branch: "#[fg={{ colors.on_surface.default.hex }},bold]"
        remote: "#[fg=<* if {{ is_dark_mode }} *>{{ colors.primary_fixed_dim.default.hex }}<* else *>{{ colors.on_primary_fixed_variant.default.hex }}<* endif *>]"
        divergence: "#[fg={{ colors.secondary.default.hex }}]"
        staged: "#[fg={{ colors.primary.default.hex }},bold]"
        conflict: "#[fg={{ colors.tertiary.default.hex }},bold]"
        modified: "#[fg={{ colors.secondary.default.hex }},bold]"
        untracked: "#[fg={{ colors.on_surface_variant.default.hex }},bold]"
        stashed: "#[fg={{ colors.outline.default.hex }},bold]"
        insertions: "#[fg={{ colors.primary.default.hex }}]"
        deletions: "#[fg={{ colors.tertiary.default.hex }}]"
        clean: "#[fg={{ colors.primary.default.hex }},bold]"

    layout: [branch, remote-branch, divergence, " - ", flags]

    options:
        branch_max_len: 0
        branch_trim: right
        ellipsis: …
        hide_clean: false
        swap_divergence: false
        divergence_space: false
        flags_without_count: false
