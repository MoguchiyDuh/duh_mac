set -g @duh_prefix_fg "{{ colors.on_tertiary.default.hex }}"
set -g @duh_prefix_bg "{{ colors.tertiary.default.hex }}"
set -g @duh_copy_fg "{{ colors.on_primary.default.hex }}"
set -g @duh_copy_bg "{{ colors.primary.default.hex }}"
set -g @duh_alert_fg "{{ colors.on_tertiary_container.default.hex }}"
set -g @duh_alert_bg "{{ colors.tertiary_container.default.hex }}"

set -g status-style "bg=default,fg={{ colors.on_surface_variant.default.hex }}"
set -g status-left-style "fg={{ colors.primary.default.hex }},bold"
set -g status-right-style "fg={{ colors.on_surface_variant.default.hex }}"
setw -g window-status-style "fg={{ colors.on_surface_variant.default.hex }}"
setw -g window-status-current-style "bg={{ colors.primary.default.hex }},fg={{ colors.on_primary.default.hex }},bold"
setw -g window-status-last-style "fg={{ colors.secondary.default.hex }}"
setw -g window-status-activity-style "fg={{ colors.tertiary.default.hex }},bold"
setw -g window-status-bell-style "bg={{ colors.tertiary_container.default.hex }},fg={{ colors.on_tertiary_container.default.hex }},bold"
set -g pane-border-style "fg={{ colors.outline_variant.default.hex }}"
set -g pane-active-border-style "fg={{ colors.primary.default.hex }}"
set -g display-panes-colour "{{ colors.outline.default.hex }}"
set -g display-panes-active-colour "{{ colors.primary.default.hex }}"
set -g message-style "bg={{ colors.surface_container_high.default.hex }},fg={{ colors.on_surface.default.hex }}"
set -g message-command-style "bg={{ colors.surface_container_high.default.hex }},fg={{ colors.tertiary.default.hex }}"
setw -g mode-style "bg={{ colors.primary_container.default.hex }},fg={{ colors.on_primary_container.default.hex }}"
setw -g copy-mode-match-style "bg={{ colors.tertiary_container.default.hex }},fg={{ colors.on_tertiary_container.default.hex }}"
setw -g copy-mode-current-match-style "bg={{ colors.tertiary.default.hex }},fg={{ colors.on_tertiary.default.hex }}"
setw -g copy-mode-mark-style "bg={{ colors.secondary_container.default.hex }},fg={{ colors.on_secondary_container.default.hex }}"
setw -g clock-mode-colour "{{ colors.primary.default.hex }}"
setw -g popup-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.on_surface.default.hex }}"
setw -g popup-border-style "fg={{ colors.outline.default.hex }}"
set -g menu-style "bg={{ colors.surface_container.default.hex }},fg={{ colors.on_surface.default.hex }}"
set -g menu-selected-style "bg={{ colors.secondary_container.default.hex }},fg={{ colors.on_secondary_container.default.hex }}"
set -g menu-border-style "fg={{ colors.outline.default.hex }}"
